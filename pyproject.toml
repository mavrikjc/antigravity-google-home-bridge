[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity-google-home-bridge"
version = "0.1.0"
description = "Always-On Full-Duplex Google Antigravity Live Voice & Google Home Bridge for Proxmox and Home Servers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "John-Isaac Clark" }
]
keywords = [
    "google-antigravity",
    "gemini-live",
    "google-home",
    "chromecast",
    "proxmox",
    "voice-assistant",
    "mcp",
    "smart-home",
    "full-duplex"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "pychromecast>=14.0.0",
    "gTTS>=2.5.3",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
antigravity = [
    "google-antigravity>=0.1.0",
]
hardware-mic = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
agy-home-bridge = "agy_home_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_home_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
